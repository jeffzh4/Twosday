<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared event | Twosday</title>
  <meta name="description" content="An event shared from Twosday.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#121016">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260723-flicker-fix">
</head>
<body class="share-page">

<main class="share-view" id="share-view">
  <div class="share-card" id="share-card">
    <div class="share-status" id="share-status">loading event…</div>
  </div>
  <a class="share-footer-link" href="/">made with twosday — a shared calendar for two</a>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/config.js?v=20260723-flicker-fix"></script>
<script src="js/utils.js?v=20260723-flicker-fix"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = (params.get('t') || '').trim();
  const statusEl = document.getElementById('share-status');
  const cardEl = document.getElementById('share-card');

  function fail(msg) {
    statusEl.textContent = msg;
  }

  if (!token) { fail('this link is missing its event id.'); return; }

  db.collection('shares').doc(token).get()
    .then(snap => {
      if (!snap.exists) { fail('this link has expired or was never valid.'); return; }
      const data = snap.data() || {};
      const ev = data.event || {};

      if (data.expiresAt && Date.now() > data.expiresAt) {
        fail('this link has expired.');
        return;
      }

      const date = parseDateKey(ev.dateKey);
      const dateLabel = date
        ? date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })
        : ev.dateKey || '';

      cardEl.innerHTML = `
        <div class="share-eyebrow">shared event</div>
        <h1 class="share-title">${escHtml(ev.title || 'event')}</h1>
        <div class="share-when">${escHtml(dateLabel)}</div>
        <div class="share-time">${escHtml(fmtFull(ev.start))} – ${escHtml(fmtFull(ev.end))} · ${escHtml(fmtDuration(ev.start, ev.end))}</div>
        ${ev.location ? `<div class="share-row"><span class="share-label">location</span><span class="share-value">${escHtml(ev.location)}</span></div>` : ''}
        ${ev.description ? `<div class="share-row"><span class="share-label">details</span><span class="share-value">${escHtml(ev.description)}</span></div>` : ''}
        ${ev.sharedBy ? `<div class="share-by">shared by ${escHtml(ev.sharedBy)}</div>` : ''}
      `;
    })
    .catch(err => {
      console.warn('Share lookup failed:', err);
      fail('could not load this event.');
    });
})();
</script>
</body>
</html>
