<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Twosday is a shared calendar for two people, built for coordinating plans, finding free time, and keeping life in sync.">

  <meta property="og:description" content="Coordinate plans, find free time, and keep life in sync in one shared calendar.">

</head>
<body class="glass-events">

<a class="skip-link" href="#main-content">skip to calendar</a>

<!-- Sync indicator: thin bar at top during initial Firestore fetch -->
<div class="sync-bar" id="sync-bar" style="display:none"></div>

<!-- Auth overlay (shown until logged in) -->
<div class="auth-overlay" id="auth-overlay" aria-labelledby="auth-title">
  <div class="auth-hero">
    <div class="auth-wordmark" id="auth-title">twosday</div>
    <p class="auth-tagline">a shared calendar for the two of you</p>
  </div>
  <div class="auth-card">
    <div class="auth-tabs" role="tablist" aria-label="Account access">
      <button class="auth-tab active" id="login-tab" data-tab="login" role="tab" aria-controls="login-form" aria-selected="true">log in</button>
      <button class="auth-tab" id="signup-tab" data-tab="signup" role="tab" aria-controls="signup-form" aria-selected="false" tabindex="-1">sign up</button>
    </div>

    <form class="auth-form" id="login-form" role="tabpanel" aria-labelledby="login-tab" autocomplete="on">
      <label class="sr-only" for="login-username">username</label>
      <input type="text" id="login-username" placeholder="username" autocomplete="username" />
      <label class="sr-only" for="login-password">password</label>
      <input type="password" id="login-password" placeholder="password" autocomplete="current-password" />
      <div class="auth-error" id="login-error" role="status" aria-live="polite"></div>
      <button type="submit">log in</button>
      <div class="auth-divider"><span>or</span></div>
      <button type="button" class="auth-google-btn" id="btn-google-signin">
        <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.08-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        continue with Google
      </button>
    </form>

    <form class="auth-form hidden" id="signup-form" role="tabpanel" aria-labelledby="signup-tab" autocomplete="off" hidden>
      <label class="sr-only" for="signup-username">choose a username</label>
      <input type="text" id="signup-username" placeholder="choose a username" autocomplete="username" />
      <label class="sr-only" for="signup-password">choose a password</label>
      <input type="password" id="signup-password" placeholder="choose a password" autocomplete="new-password" />
      <label class="sr-only" for="signup-password-confirm">confirm password</label>
      <input type="password" id="signup-password-confirm" placeholder="confirm password" autocomplete="new-password" />
      <label class="sr-only" for="signup-profile1">first profile name</label>
      <input type="text" id="signup-profile1" placeholder="first profile name (e.g. jeff)" />
      <label class="sr-only" for="signup-profile2">second profile name</label>
      <input type="text" id="signup-profile2" placeholder="second profile name (e.g. helen)" />
      <div class="auth-error" id="signup-error" role="status" aria-live="polite"></div>
      <button type="submit">create account</button>
      <div class="auth-hint">both profile names appear as tabs in your calendar</div>
      <div class="auth-divider"><span>or</span></div>
      <button type="button" class="auth-google-btn" id="btn-google-signup">
        <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.08-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        continue with Google
      </button>
      <div class="auth-hint">already connected Google? this logs you in — no new account is created</div>
    </form>
  </div>
  <a class="auth-privacy-link" href="/privacy.html">privacy</a>
</div>

<!-- Main app (hidden until logged in) -->
<div class="app" style="display:none">
  <header class="header">
    <div class="header-left">
      <h1 class="title">twosday</h1>
      <nav class="nav-controls" aria-label="Calendar date navigation">
        <button class="nav-btn" id="btn-prev" aria-label="Previous period">&#8249;</button>
        <div class="nav-label" id="nav-label" aria-live="polite"></div>
        <button class="nav-btn" id="btn-next" aria-label="Next period">&#8250;</button>
        <button class="nav-today-btn" id="btn-today">today</button>
      </nav>
    </div>
    <div class="header-right">
      <div class="user-pill" id="user-pill">
        <span class="user-pill-name" id="user-pill-name"></span>
        <button class="user-pill-settings" id="btn-settings" title="Account settings" aria-label="Account settings">&#9881;</button>
        <button class="user-pill-logout" id="btn-logout">log out</button>
      </div>
      <span class="sync-status" id="sync-status" role="status" aria-live="polite" title="Calendar sync status">synced</span>
      <button class="btn-icon" id="btn-search" title="Search events (/)" aria-label="Search events" aria-controls="search-container" aria-expanded="false">&#128269;</button>
      <button class="btn-icon" id="btn-theme" title="Toggle theme" aria-label="Toggle color theme">&#9790;</button>
      <button class="btn-icon" id="btn-undo" title="Undo" aria-label="Undo last calendar change">&#8630;</button>
      <button class="btn-icon" id="btn-redo" title="Redo" aria-label="Redo last calendar change">&#8631;</button>
      <div class="view-switch" id="view-switch" role="tablist" aria-label="Calendar view"></div>
      <button class="btn-calendar-tools" id="btn-calendar-tools">import/export</button>
      <button class="btn-conflicts" id="btn-conflicts">conflicts</button>
      <button class="btn-find" id="btn-find-time">find time</button>
      <button class="notes-toggle" id="btn-notes" aria-controls="notes-panel" aria-expanded="false">&#9998; notes</button>
    </div>
  </header>
  <div class="user-switcher" id="user-switcher" role="tablist" aria-label="Profile calendar"></div>
  <div class="presence-strip" id="presence-strip" aria-live="polite"></div>

  <!-- Search bar (hidden by default, slides in below user-switcher) -->
  <div class="search-container" id="search-container" role="search" style="display:none">
    <div class="search-bar-row">
      <span class="search-icon-inline">&#128269;</span>
      <label class="sr-only" for="search-input">search events across all dates</label>
      <input class="search-input" id="search-input" placeholder="search events across all dates…" autocomplete="off" />
      <button class="search-close-btn" id="search-close" aria-label="Close search">&#215;</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <main class="main-content" id="main-content" tabindex="-1"></main>
</div>

<aside class="notes-panel" id="notes-panel" aria-label="Profile notes" aria-hidden="true" inert>
  <div class="notes-header">
    <h3>notes</h3>
    <button class="notes-close" id="notes-close" aria-label="Close notes">&times;</button>
  </div>
  <div class="notes-list" id="notes-list"></div>
  <div class="notes-input-area">
    <div class="notes-input-row">
      <label class="sr-only" for="notes-input">write a note</label>
      <textarea class="notes-input" id="notes-input" placeholder="write a note..." rows="1"></textarea>
      <button class="notes-send" id="notes-send">add</button>
    </div>
  </div>
</aside>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="js/config.js?v=20260728-app-check"></script>

<script src="js/command-palette.js?v=20260727-write-seam"></script>
<script src="js/share.js?v=20260727-write-seam"></script>

</body>
</html>
